title: PowerShell Started With an Encoded Command
id: 0b8f6a52-93de-4f6e-8d0a-7c3e4e5a9b22
status: experimental
description: PowerShell launched with -enc / -EncodedCommand, often used to hide what a command does.
author: Chaitanya Asole
date: 2026/11/25
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    NewProcessName|endswith: '\powershell.exe'
  selection_cmd:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection_img and selection_cmd
falsepositives:
  - Some management and deployment tools use encoded commands (tune by parent process)
level: high
